<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Vuelves conmigo?</title>
<style>
  :root{
    --fondo:#0a090c;
    --ventana:#1a1720;
    --barra1:#5c1626;
    --barra2:#2a0c14;
    --borde-claro:#4a4350;
    --borde-oscuro:#08070a;
    --hueso:#e8e2d9;
    --vino:#a8324a;
    --oro:#c9a227;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:20px;
    background:
      radial-gradient(circle at 50% 0%, rgba(109,27,46,.35), transparent 60%),
      radial-gradient(circle at 20% 100%, rgba(60,20,40,.4), transparent 55%),
      var(--fondo);
    font-family: 'Courier New', Courier, monospace;
    color:var(--hueso);
    overflow:hidden;
  }
  .petalo{
    position:fixed; top:-40px; color:var(--vino); opacity:.3;
    font-size:16px; animation:caer linear infinite; pointer-events:none; z-index:0;
  }
  @keyframes caer{ to{ transform:translateY(110vh) rotate(360deg); } }

  /* ---- ventana estilo 95 ---- */
  .ventana{
    position:relative; z-index:2;
    width:100%; max-width:480px;
    background:var(--ventana);
    border:2px solid;
    border-color:var(--borde-claro) var(--borde-oscuro) var(--borde-oscuro) var(--borde-claro);
    box-shadow:0 0 60px rgba(109,27,46,.45), 6px 6px 0 rgba(0,0,0,.6);
    padding:3px;
  }
  .barra{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(90deg, var(--barra1), var(--barra2));
    padding:4px 6px; font-size:13px; letter-spacing:.06em;
    color:#f0e9e0; font-weight:bold;
  }
  .barra .icono{ margin-right:6px; color:var(--oro); }
  .controles{ display:flex; gap:3px; }
  .ctrl{
    width:18px; height:16px; display:grid; place-items:center;
    background:var(--ventana); color:var(--hueso); font-size:10px;
    border:1px solid;
    border-color:var(--borde-claro) var(--borde-oscuro) var(--borde-oscuro) var(--borde-claro);
  }
  .cuerpo{ padding:26px 22px 22px; }

  .simbolo{ text-align:center; font-size:26px; color:var(--vino); letter-spacing:.4em; margin-bottom:18px; }
  .pregunta{
    font-family: Georgia, serif;
    font-size:clamp(20px, 5.5vw, 27px);
    line-height:1.5; text-align:center;
    margin:0 0 10px; min-height:2.6em;
    color:var(--hueso);
    text-shadow:0 0 20px rgba(168,50,74,.5);
  }
  .cursor{
    display:inline-block; width:9px; height:1.05em;
    background:var(--vino); vertical-align:-3px; margin-left:2px;
    animation:parpadear 1s steps(1) infinite;
  }
  @keyframes parpadear{ 50%{ opacity:0; } }
  .nota{
    text-align:center; font-size:12px; color:#8f8794;
    letter-spacing:.08em; margin:0 0 26px; min-height:1.2em;
  }

  .botones{ display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
  button{
    font-family:'Courier New', monospace; font-size:14px; font-weight:bold;
    letter-spacing:.1em; text-transform:uppercase;
    padding:13px 22px; cursor:pointer; color:var(--hueso);
    background:var(--ventana);
    border:2px solid;
    border-color:var(--borde-claro) var(--borde-oscuro) var(--borde-oscuro) var(--borde-claro);
    transition:transform .18s ease, background .2s ease;
  }
  button:active{ border-color:var(--borde-oscuro) var(--borde-claro) var(--borde-claro) var(--borde-oscuro); }
  #btnSi{
    background:linear-gradient(180deg, var(--barra1), #400f1c);
    border-color:var(--vino) var(--borde-oscuro) var(--borde-oscuro) var(--vino);
    box-shadow:0 0 22px rgba(168,50,74,.5);
  }
  #btnSi:hover{ filter:brightness(1.3); transform:translateY(-2px); }
  #btnNo{ position:relative; }

  /* ventana final */
  .final{
    position:fixed; inset:0; z-index:5;
    display:none; place-items:center; padding:20px;
    background:rgba(4,3,6,.88); backdrop-filter:blur(4px);
  }
  .final.activo{ display:grid; }
  .final .ventana{ max-width:420px; }
  .final p{
    font-family:Georgia, serif; font-size:17px; line-height:1.85;
    text-align:center; color:#d6cfc5; margin:0 0 24px;
  }
  .final h2{
    font-family:Georgia, serif; font-weight:normal; font-size:23px;
    text-align:center; margin:0 0 16px; color:var(--hueso);
  }
</style>
</head>
<body>

<div class="ventana">
  <div class="barra">
    <span><span class="icono">✦</span>propuesta.exe</span>
    <span class="controles"><span class="ctrl">_</span><span class="ctrl">□</span><span class="ctrl">✕</span></span>
  </div>
  <div class="cuerpo">
    <div class="simbolo">✝ ✦ ✝</div>
    <p class="pregunta"><span id="texto"></span><span class="cursor"></span></p>
    <p class="nota" id="nota"></p>

    <div class="botones">
      <button id="btnSi">Sí, acepto</button>
      <button id="btnNo">No</button>
    </div>
  </div>
</div>

<div class="final" id="final">
  <div class="ventana">
    <div class="barra">
      <span><span class="icono">🖤</span>respuesta_guardada.exe</span>
      <span class="controles"><span class="ctrl">✕</span></span>
    </div>
    <div class="cuerpo">
      <h2>Sabía que dirías que sí</h2>
      <p>No sé a dónde vamos, pero sé con quién quiero ir.<br>Gracias por no rendirte con el botón.</p>
      <button onclick="document.getElementById('final').classList.remove('activo')" style="width:100%">Cerrar</button>
    </div>
  </div>
</div>

<script>
  /* pétalos */
  const simbolos = ['✦','❦','✧','·'];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'petalo';
    p.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (9 + Math.random() * 10) + 's';
    p.style.animationDelay = (-Math.random() * 12) + 's';
    p.style.fontSize = (11 + Math.random() * 14) + 'px';
    document.body.appendChild(p);
  }

  /* texto que se escribe solo */
  const frase = '¿Vuelves conmigo?';
  const destino = document.getElementById('texto');
  let i = 0;
  function escribir(){
    if (i < frase.length){
      destino.textContent += frase[i];
      i++;
      setTimeout(escribir, 110);
    }
  }
  setTimeout(escribir, 600);

  /* el botón "No" que no deja decir que no */
  const btnNo = document.getElementById('btnNo');
  const nota = document.getElementById('nota');
  const frases = [
    '¿Seguro?',
    'Piénsalo otra vez…',
    'No es tan fácil.',
    'Ese botón está roto.',
    'Intenta con el otro.',
    'En serio, no funciona.',
    'El destino no te deja.',
    'Ya ríndete, di que sí.',
    'Este botón no existe.'
  ];
  const textosNo = ['No','¿No?','No…','Casi','Nop','Nope','No puedo','Ayuda'];
  let intentos = 0;

  function escapar(){
    intentos++;
    const x = (Math.random() - 0.5) * 180;
    const y = (Math.random() - 0.5) * 90;
    btnNo.style.transform = `translate(${x}px, ${y}px) scale(${Math.max(0.45, 1 - intentos * 0.07)})`;
    btnNo.textContent = textosNo[Math.min(intentos, textosNo.length - 1)];
    nota.textContent = frases[Math.min(intentos - 1, frases.length - 1)];
  }

  btnNo.addEventListener('mouseenter', escapar);
  btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); escapar(); }, {passive:false});
  btnNo.addEventListener('click', (e) => { e.preventDefault(); escapar(); });

  /* aceptar */
  document.getElementById('btnSi').addEventListener('click', () => {
    document.getElementById('final').classList.add('activo');
  });
</script>
</body>
</html>
